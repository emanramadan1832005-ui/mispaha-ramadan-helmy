<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مسبحة رمضان حلمي</title>
  <style>
    :root{--bg1:#0f2027;--bg2:#203a43;--bg3:#2c5364;--card:#14313a;--accent:#ffd54a;--muted:rgba(255,255,255,0.75)}
    html,body{height:100%;margin:0;font-family:"Segoe UI", Tahoma, Arial, "Noto Naskh Arabic", sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2),var(--bg3));color:#fff}
    .container{max-width:480px;margin:40px auto;padding:20px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,0.5);text-align:center}
    h1{margin:6px 0;font-size:1.6rem}
    p.lead{margin:0;color:var(--muted)}
    .counter{font-size:68px;margin:22px 0;font-weight:700}
    .meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
    .meta select,.meta button{background:var(--card);color:#fff;border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px}
    .buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
    .btn{font-size:18px;padding:14px 22px;border-radius:28px;border:none;cursor:pointer;min-width:130px}
    .btn-primary{background:linear-gradient(90deg,#4CAF50,#2E8B57)}
    .btn-danger{background:linear-gradient(90deg,#f44336,#d32f2f)}
    footer{margin-top:18px;color:var(--muted);font-size:13px}
    @media (max-width:420px){.counter{font-size:48px}.btn{min-width:110px}}
  </style>
</head>
<body>
  <div class="container" role="application" aria-label="مسبحة رمضان حلمي">
    <h1>مسبحة رمضان حلمي</h1>
    <p class="lead">سبّح وشارك الأجر — اضغط أو اضغط مطولاً للعد التلقائي</p>
    <div class="counter" id="count" aria-live="polite">0</div>
    <div class="meta">
      <label for="limitSelect">دورة:
        <select id="limitSelect"><option value="33">33</option><option value="99">99</option><option value="0">بدون حد</option></select>
      </label>
      <div>
        <button id="vibToggle" class="small" aria-pressed="false">هزاز: إيقاف</button>
        <button id="soundToggle" class="small" aria-pressed="false">صوت: إيقاف</button>
      </div>
    </div>
    <div class="buttons">
      <button id="tasbeehBtn" class="btn btn-primary" aria-label="سبح">سبح</button>
      <button id="resetBtn" class="btn btn-danger" aria-label="تصفير">تصفير</button>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:center">
      <button id="shareBtn" class="small">مشاركة/نسخ</button>
      <button id="saveBtn" class="small">حفظ ملف</button>
    </div>
    <div style="margin-top:10px;color:rgba(255,255,255,0.8);font-size:14px" id="status">
      <span id="cycles">الدورات المكتملة: 0</span> — <span id="limitText">الحد: 33</span>
    </div>
    <footer>صدقة جارية باسم رمضان حلمي — حفظ تلقائي على جهازك</footer>
  </div>

<script>
(() => {
  const countEl = document.getElementById('count'), btn = document.getElementById('tasbeehBtn'), resetBtn = document.getElementById('resetBtn');
  const limitSelect = document.getElementById('limitSelect'), cyclesEl = document.getElementById('cycles'), limitText = document.getElementById('limitText');
  const vibToggle = document.getElementById('vibToggle'), soundToggle = document.getElementById('soundToggle');
  const shareBtn = document.getElementById('shareBtn'), saveBtn = document.getElementById('saveBtn');
  const KEY = 'tasbeeh_state_v1';
  let state = { count:0, limit:33, cycles:0, vibrate:false, sound:false }, holdInterval=null, audioCtx=null;

  function loadState(){ try{ const raw=localStorage.getItem(KEY); if(raw) Object.assign(state, JSON.parse(raw)); }catch(e){} limitSelect.value=String(state.limit); updateUI(); }
  function saveState(){ localStorage.setItem(KEY, JSON.stringify(state)); }
  function updateUI(){ countEl.textContent=state.count; cyclesEl.textContent='الدورات المكتملة: '+state.cycles; limitText.textContent= state.limit===0? 'الحد: بدون حد':'الحد: '+state.limit; vibToggle.textContent='هزاز: '+(state.vibrate?'تشغيل':'إيقاف'); soundToggle.textContent='صوت: '+(state.sound?'تشغيل':'إيقاف'); }
  function beep(){ if(!state.sound) return; try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=520; g.gain.value=0.06; o.connect(g); g.connect(audioCtx.destination); o.start(); setTimeout(()=>o.stop(),80);}catch(e){}}
  function vibrate(){ if(state.vibrate && navigator.vibrate) navigator.vibrate(20); }
  function increment(){ state.count++; if(state.limit>0 && state.count>=state.limit){ state.cycles++; setTimeout(()=>{ document.body.style.transition='background-color 220ms'; document.body.style.backgroundColor='rgba(255,213,74,0.06)'; setTimeout(()=>document.body.style.backgroundColor='',280); },50); state.count=0; } beep(); vibrate(); saveState(); updateUI(); }

  btn.addEventListener('click', increment);
  btn.addEventListener('pointerdown', (e)=>{ if(e.button!==0) return; clearInterval(holdInterval); holdInterval=setInterval(increment,120); });
  document.addEventListener('pointerup', ()=>clearInterval(holdInterval));
  resetBtn.addEventListener('click', ()=>{ if(!confirm('هل أنت متأكد أنك تريد تصفير العداد؟')) return; state.count=0; state.cycles=0; saveState(); updateUI(); });
  limitSelect.addEventListener('change', ()=>{ state.limit=parseInt(limitSelect.value,10); saveState(); updateUI(); });
  vibToggle.addEventListener('click', ()=>{ state.vibrate=!state.vibrate; saveState(); updateUI(); });
  soundToggle.addEventListener('click', ()=>{ state.sound=!state.sound; saveState(); updateUI(); });

  shareBtn.addEventListener('click', async ()=>{ const text=`مسبحة رمضان حلمي — العداد: ${state.count} — الدورات المكتملة: ${state.cycles} — الحد: ${state.limit===0?'بدون حد':state.limit}`; if(navigator.share){ try{ await navigator.share({title:'مسبحة رمضان حلمي', text}); return;}catch(e){} } try{ await navigator.clipboard.writeText(text); alert('نُسخ النص للحافظة'); }catch(e){ alert(text); }});
  saveBtn.addEventListener('click', ()=>{ const html = `<!doctype html><html lang=\"ar\" dir=\"rtl\"><meta charset=\"utf-8\"><title>مسبحة رمضان حلمي</title><body><h1>مسبحة رمضان حلمي</h1><p>العداد: ${state.count}</p><p>الدورات المكتملة: ${state.cycles}</p></body></html>`; const blob=new Blob([html],{type:'text/html'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='mispaha-ramadan-helmy.html'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); });

  loadState();
  window.addEventListener('load', ()=>{ const sr=document.createElement('span'); sr.setAttribute('aria-hidden','true'); sr.style.position='absolute'; sr.style.left='-9999px'; sr.textContent='واجهة مسبحة رمضان حلمي جاهزة'; document.body.appendChild(sr); });
})();
</script>
</body>
  </html>
